<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAVR — студия и плеер для артистов</title>
<link id="site-icon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff3d6e'/%3E%3Cpath d='M12 32h5M22 22v20M32 14v36M42 22v20M52 28v8' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--acc:#ff5a36;--acc2:#ff2d87;--grad:linear-gradient(100deg,var(--acc),var(--acc2));--r:22px;
 --bg:#07070b;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--txt:#f6f6fb;--mut:#9a9ab2;--wave:rgba(255,255,255,.2);--glass:rgba(14,14,20,.72);--shadow:0 20px 60px -24px rgba(0,0,0,.8);--opt:#16161f}
[data-theme=light]{--bg:#f3f3f8;--panel:rgba(255,255,255,.8);--panel2:rgba(20,20,40,.06);--line:rgba(20,20,40,.09);--line2:rgba(20,20,40,.18);--txt:#13131c;--mut:#6a6a82;--wave:rgba(20,20,40,.18);--glass:rgba(255,255,255,.78);--shadow:0 20px 50px -26px rgba(30,30,70,.35);--opt:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Inter","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 1.2s;
 background:radial-gradient(900px 600px at 88% -10%,color-mix(in srgb,var(--g2,var(--acc2)) 24%,transparent),transparent 62%),radial-gradient(800px 600px at -5% 105%,color-mix(in srgb,var(--g1,var(--acc)) 20%,transparent),transparent 62%)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;transition:transform .12s,background .15s,color .15s,opacity .15s}
button:active{transform:scale(.96)}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:3px solid transparent;background-clip:padding-box}
.ic{width:20px;height:20px;flex:none}
/* nav */
aside.nav{position:fixed;left:14px;top:14px;bottom:106px;width:224px;padding:16px 12px;border:1px solid var(--line);border-radius:26px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);z-index:30;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:21px;letter-spacing:.04em;padding:4px 10px 18px}
.logo i{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px -8px var(--acc)}
.logo i svg{width:20px;height:20px;color:#fff}
.nl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:var(--mut);font-weight:600;position:relative}
.nl:hover{background:var(--panel2);color:var(--txt)}
.nl.on{background:var(--panel2);color:var(--txt)}
.nl.on:before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
.nl.on .ic{color:var(--acc)}
.nl.up{margin-top:12px;background:var(--grad);color:#fff;justify-content:center;box-shadow:0 10px 30px -12px var(--acc)}
.nl.up:hover{filter:brightness(1.1)}.nl.up:before{display:none}
.navft{margin-top:auto;padding:10px;display:flex;flex-direction:column;gap:10px;color:var(--mut);font-size:12px}
.sw{display:flex;gap:8px;align-items:center}
.sw b{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;outline:2px solid transparent;transition:.15s}
.sw b:hover{transform:scale(1.15)}.sw b.on{outline-color:var(--txt)}
.meter{height:5px;border-radius:9px;background:var(--panel2);overflow:hidden}.meter i{display:block;height:100%;background:var(--grad);width:0}
header.top{position:fixed;left:252px;right:14px;top:14px;height:56px;display:flex;align-items:center;gap:12px;padding:0 10px 0 8px;z-index:20}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:999px;padding:13px 18px 13px 46px;outline:0;transition:.15s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.search .ic{position:absolute;left:16px;top:14px;color:var(--mut)}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-weight:800}
.ibtn:hover{border-color:var(--line2)}
main{position:relative;z-index:1;margin-left:252px;padding:92px 28px 150px;max-width:1260px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px}
h1{font-size:32px;line-height:1.12;margin:0 0 6px;letter-spacing:-.03em;font-weight:800}h2{font-size:19px;margin:30px 0 14px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}h3{margin:0 0 10px;font-size:15px}
.sub{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;background:var(--grad);color:#fff;box-shadow:0 10px 28px -14px var(--acc)}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--panel2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--line2)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.tabs{display:flex;gap:6px;margin:6px 0 18px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;color:var(--mut)}
.tab:hover{color:var(--txt);border-color:var(--line2)}
.tab.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.tab small{opacity:.6;margin-left:4px}
/* hero & empty */
.hero{position:relative;border-radius:30px;padding:44px;margin-bottom:26px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 26%,var(--bg)),color-mix(in srgb,var(--acc2) 20%,var(--bg)) 55%,var(--bg))}
.hero h1{font-size:44px;max-width:640px}.hero p{max-width:540px;font-size:16px;color:var(--mut);margin:0 0 22px}
.eqbg{position:absolute;right:30px;bottom:0;display:flex;gap:8px;align-items:flex-end;height:200px;opacity:.9}
.eqbg i{width:12px;border-radius:8px 8px 0 0;background:var(--grad);animation:eq 1.6s infinite ease-in-out;opacity:.85}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.feat div{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.feat .ic{width:26px;height:26px;color:var(--acc);margin-bottom:10px}.feat b{display:block;margin-bottom:4px;font-size:15px}.feat span{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:56px 20px;border:1px dashed var(--line2);border-radius:var(--r);background:var(--panel)}
.empty .ic{width:36px;height:36px;color:var(--acc);margin-bottom:8px}.empty b{display:block;color:var(--txt);font-size:17px;margin-bottom:4px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.kpi{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.kpi b{display:block;font-size:24px;letter-spacing:-.03em}.kpi span{color:var(--mut);font-size:12px}
/* cards */
.card{display:flex;gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;transition:.2s;position:relative;backdrop-filter:blur(8px)}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card.cur{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));box-shadow:0 24px 70px -34px var(--acc)}
.cover{position:relative;width:168px;height:168px;flex:none;border-radius:16px;background-size:cover;background-position:center;cursor:pointer;overflow:hidden;box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.cover.sm{width:46px;height:46px;border-radius:11px;box-shadow:none}
.cover.xl{width:240px;height:240px;border-radius:20px}
.cover .ltr{position:absolute;left:12px;bottom:6px;font-size:44px;font-weight:800;color:rgba(255,255,255,.35);letter-spacing:-.04em;line-height:1}.cover.sm .ltr{display:none}
.pbtn{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);opacity:0;transition:.18s;color:#fff}
.pbtn .ic{width:38px;height:38px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}.cover.sm .pbtn .ic{width:20px;height:20px}
.cover:hover .pbtn,.cover.playing .pbtn{opacity:1}
.cover.playing .i-play,.cover:not(.playing) .i-pause{display:none}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.chead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ua{display:block;color:var(--mut);font-size:13px;font-weight:500}.ua:hover{color:var(--txt)}
.tt{display:block;font-size:21px;font-weight:800;letter-spacing:-.025em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt:hover{color:var(--acc)}
.meta{color:var(--mut);font-size:12px;text-align:right;white-space:nowrap}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 11px;font-size:12px;color:var(--mut);font-weight:500}
a.tag:hover{color:var(--txt);border-color:var(--acc)}
.wave{position:relative;height:84px;cursor:pointer;margin-top:auto}
.wave.big{height:170px}
.wave canvas{width:100%;height:100%;display:block}
.wave .fx{position:absolute;inset:0;pointer-events:none}
.wave .tip{position:absolute;bottom:100%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:3px 9px;border-radius:9px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;display:none;z-index:5;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.fly{position:absolute;bottom:10px;font-size:24px;animation:fly 1.9s ease-out forwards;transform:translateX(-50%);white-space:nowrap}
.fly.cm{font-size:12px;background:var(--grad);padding:4px 11px;border-radius:99px;color:#fff;max-width:240px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-80px) scale(1.25)}}
.acts{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin:0 -8px -4px}
.ab{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;color:var(--mut);font-size:13px;font-weight:600}
.ab:hover{background:var(--panel2);color:var(--txt)}
.ab .ic{width:17px;height:17px}
.ab.liked{color:var(--acc2)}.ab.liked .ic{fill:var(--acc2)}
.grow{flex:1}.plays{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12px;padding-right:8px}.plays .ic{width:12px;height:12px;fill:currentColor}
/* rows */
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.row{display:flex;align-items:center;gap:14px;padding:8px 10px;border-radius:14px;width:100%;text-align:left}
.row:hover,.row.cur{background:var(--panel2)}
.rk{width:26px;text-align:center;font-weight:800;color:var(--mut);font-size:15px}
.row:nth-child(-n+3) .rk{color:var(--acc)}
.rt{flex:1;min-width:0}.rt a,.rt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt a:first-child{font-weight:700}.rt a:last-child,.rt span{color:var(--mut);font-size:12px}
.rs{color:var(--mut);font-size:12px;min-width:56px;text-align:right}
#player[class*="pfx-"],#np[class*="pfx-"]{isolation:isolate}#player[class*="pfx-"]::before,#player[class*="pfx-"]::after,#np[class*="pfx-"]::before,#np[class*="pfx-"]::after{pointer-events:none;border-radius:inherit;max-width:100%;z-index:0}#player[class*="skin-"]>*,#np[class*="skin-"]>.npw{position:relative}
body.hid *,body.hid *::before,body.hid *::after{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){#player[class*="pfx-"] *,#np[class*="pfx-"] *,#player[class*="pfx-"]::before,#player[class*="pfx-"]::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.alb-pick{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}.alb-pick input{width:auto}
.rt .byl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-size:12px}.rt .byl a{display:inline;font-size:12px;font-weight:400!important;color:var(--mut)}.byl .ft a{color:var(--acc)}.byl .ft a:hover{text-decoration:underline}
.av{width:56px;height:56px;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;flex:none}
.av.sm{width:32px;height:32px;font-size:13px}.av.xl{width:128px;height:128px;font-size:48px;border:5px solid var(--bg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
/* forms */
.f{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:0;margin-bottom:12px;transition:.15s}
.f:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 16%,transparent)}
select.f option{background:var(--opt);color:var(--txt)}
textarea.f{min-height:90px;resize:vertical}
input[type=file].f{padding:9px}
label.l{display:block;color:var(--mut);font-size:12px;font-weight:600;margin:0 0 5px}
.drop{display:block;border:2px dashed var(--line2);border-radius:26px;padding:46px 20px;text-align:center;color:var(--mut);cursor:pointer;margin-bottom:18px;transition:.2s;background:var(--panel)}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--txt);background:color-mix(in srgb,var(--acc) 8%,var(--panel))}
.drop .ic{width:34px;height:34px;color:var(--acc);margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* profile */
.banner{height:210px;border-radius:30px;position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.28),transparent 50%)}
.phead>div:not(.av){padding-top:72px}.phead{display:flex;gap:22px;align-items:flex-start;padding:0 28px;margin-top:-62px;flex-wrap:wrap;position:relative;z-index:1}
/* now listening */
.nplv{display:flex;align-items:center;gap:14px;margin-top:20px;padding:12px 18px 12px 12px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);max-width:560px}
.nplv.live{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:linear-gradient(100deg,color-mix(in srgb,var(--acc) 13%,var(--panel)),var(--panel))}
.nplv.priv{border-style:dashed;padding:12px 18px}
.nplv .cover{width:52px;height:52px;border-radius:12px;box-shadow:none}
.nplv .nptx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.nplv .npk{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.nplv.live .npk{color:var(--acc)}
.nplv .nptt{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nplv .npaa{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.nplv.priv .npaa{white-space:normal}.nplv:not(.priv) .npaa{white-space:nowrap}
.nplv a:hover{text-decoration:underline}
.npeq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.npeq i{display:block;width:3px;height:30%;border-radius:2px;background:currentColor;animation:npeq 1s ease-in-out infinite}
.npeq i:nth-child(2){animation-delay:.25s}.npeq i:nth-child(3){animation-delay:.5s}
@keyframes npeq{0%,100%{height:25%}50%{height:100%}}
@media(prefers-reduced-motion:reduce){.npeq i{animation:none;height:70%}}
/* comments */
.cmt{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cmt .tm{color:var(--acc);font-weight:700;font-size:12px;cursor:pointer;background:var(--panel2);padding:1px 9px;border-radius:99px}
.cmt .del{margin-left:auto;color:var(--mut);opacity:0}.cmt:hover .del{opacity:1}
.cform{display:flex;gap:8px;align-items:center;margin:12px 0}
.cform .f{margin:0;flex:1}
.rx{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.rx button{font-size:24px;width:48px;height:48px;border-radius:15px;background:var(--panel2);border:1px solid var(--line)}
.rx button:hover{transform:translateY(-4px) scale(1.1);border-color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:7px;height:180px;padding-top:12px}
.bars div{flex:1;background:var(--grad);border-radius:8px 8px 3px 3px;min-height:4px;position:relative;opacity:.9;transition:.15s}
.bars div:hover{opacity:1;filter:brightness(1.15)}
.bars div:hover:after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;margin-bottom:4px}
.bl{display:flex;gap:7px;color:var(--mut);font-size:10px;margin-top:6px}.bl span{flex:1;text-align:center}
/* player */
#player{position:fixed;left:14px;right:14px;bottom:14px;height:78px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);z-index:50;display:grid;grid-template-columns:minmax(200px,1fr) minmax(320px,2fr) minmax(220px,1fr);align-items:center;gap:16px;padding:0 18px;overflow:hidden}
#player:before{content:"";position:absolute;left:0;top:0;height:2px;width:var(--p,0%);background:var(--grad);transition:width .2s linear}
.pl-l{display:flex;gap:12px;align-items:center;min-width:0}
.pl-l .cover{width:52px;height:52px;border-radius:13px;cursor:default;box-shadow:0 8px 22px -10px #000}
.pl-l .t{min-width:0}.pl-l .t a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-l .t a:first-child{font-weight:700}.pl-l .t a:last-child{color:var(--mut);font-size:12px}
.pl-c{display:flex;flex-direction:column;gap:5px;align-items:center}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button{color:var(--mut);display:grid;place-items:center;width:34px;height:34px;border-radius:50%}
.ctl button:hover{color:var(--txt)}.ctl button.on{color:var(--acc)}
.ctl .main{width:46px;height:46px;background:var(--txt);color:var(--bg)}.ctl .main:hover{color:var(--bg);transform:scale(1.07)}
.ctl .main .i-pause{display:none}.playing-ui .ctl .main .i-pause{display:block}.playing-ui .ctl .main .i-play{display:none}
.prog{display:flex;gap:10px;align-items:center;width:100%;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
#pbar{flex:1;height:6px;background:var(--panel2);border-radius:9px;position:relative;cursor:pointer;touch-action:none}
#pbar:hover{height:8px}
#pfill{height:100%;width:0;background:var(--grad);border-radius:9px;position:relative}
#pfill:after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);opacity:0;transition:.15s}
#pbar:hover #pfill:after{opacity:1}
#lp{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--acc) 45%,transparent);border-radius:4px;display:none}
.pl-r{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.pl-r button{color:var(--mut);display:grid;place-items:center;height:34px;min-width:34px;border-radius:11px;font-weight:700;font-size:12px;padding:0 6px}
.pl-r button:hover{color:var(--txt);background:var(--panel2)}.pl-r button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.pl-r input[type=range]{width:84px;accent-color:var(--acc)}
#viz{width:84px;height:32px}
/* overlays */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}

function imgData(file,max=380,o){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{if(o&&o.gif&&file.type==='image/gif'){if(canGif()){if(file.size>o.lim){toast('GIF слишком тяжёлый: максимум '+Math.round(o.lim/1024)+' КБ');return rej(new Error('gif size'))}return res({url:r.result,color:'rgb(40,40,70)',gif:1})}toast('Анимированные GIF — только с WAVR+. Загружена статичная картинка')}const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
 const s=document.createElement('canvas');s.width=s.height=1;const sx=s.getContext('2d');sx.drawImage(c,0,0,1,1);const d=sx.getImageData(0,0,1,1).data;res({url:c.toDataURL('image/jpeg',.82),color:`rgb(${d[0]},${d[1]},${d[2]})`})};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function handleAudio(f){if(!f)return;if(!/^audio\//.test(f.type)&&!/\.(mp3|wav|ogg|flac|m4a|aac|opus)$/i.test(f.name)){toast('Это не аудиофайл');return}
 U={...U,file:f,title:U.file?U.title:f.name.replace(/\.[^.]+$/,''),busy:1,peaks:null,dur:0};if(route().p!=='upload')location.hash='#/upload';render(true);
 try{const ab=await f.arrayBuffer();const oc=new OfflineAudioContext(1,1,44100);const buf=await oc.decodeAudioData(ab);U.peaks=peaksOf(buf.getChannelData(0));U.dur=buf.duration}
 catch(e){U.peaks=Array.from({length:170},(_,i)=>.2+Math.abs(Math.sin(i/6))*.5);const a=new Audio(URL.createObjectURL(f));await new Promise(r=>{a.onloadedmetadata=r;a.onerror=r});U.dur=isFinite(a.duration)?a.duration:0;toast('Не удалось построить волну — показан макет')}

const canon=v=>v&&typeof v==='object'?Array.isArray(v)?'['+v.map(canon).join(',')+']':'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v);
const jp=(s,d)=>{try{const x=JSON.parse(s);return x==null?d:x}catch(e){return d}};
const me=()=>ses&&ses.uid;
const isAdminNow=()=>{const c=C.get('acc:'+me());return !!(c&&c.v&&c.v.num===1)};

/* ---------- сессия Supabase Auth ---------- */
function persist(){if(!ses)return;const st=ses.mem?LS:SS,ot=ses.mem?SS:LS;oSet.call(st,'wavr_sb',JSON.stringify({at:ses.at,rt:ses.rt,exp:ses.exp,uid:ses.uid,login:ses.login}));oRem.call(ot,'wavr_sb')}
function setSes(j,mem,login){ses={at:j.access_token,rt:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:(j.user&&j.user.id)||(ses&&ses.uid),mem:!!mem,login:login||(ses&&ses.login)||''};persist()}
function readSes(){for(const [st,mem] of [[LS,1],[SS,0]]){const o=jp(st.getItem('wavr_sb'),null);if(o&&o.rt&&o.uid)return{...o,mem:!!mem}}return null}
async function tok(){if(!ses)throw new Error('auth');if(ses.exp-60>Date.now()/1000)return ses.at;
 if(!RP)RP=(async()=>{try{const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:ses.rt})});
  if(!r.ok){throw new Error(r.status>=400&&r.status<500?'auth':'net')}setSes(await r.json(),ses.mem,ses.login)}finally{RP=null}})();
 await RP;return ses.at}
const rest=async(m,p,b,h)=>{const t=await tok();return fetch(SB+'/rest/v1/'+p,{method:m,headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',...(h||{})},body:b==null?undefined:JSON.stringify(b)})};
SP.removeItem=function(k){if((this===LS||this===SS)&&k==='wavr_sess'){oRem.call(LS,'wavr_sb');oRem.call(SS,'wavr_sb');ses=null}return oRem.apply(this,arguments)};

window.sbSignUp=async(login,pw,rem)=>{try{const r=await fetch(SB+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:emailOf(login),password:pw})});
 const j=await r.json().catch(()=>({}));if(!r.ok){const m=String(j.msg||j.message||j.error_description||j.error||'');return{err:/already|registered|exists/i.test(m)?'Этот логин уже занят':/rate limit/i.test(m)?'Регистрация временно недоступна. Попробуйте чуть позже.':'Ошибка регистрации: '+m}}
 if(!j.access_token){console.warn('WAVR: в Supabase включено Confirm email — отключите его (Authentication → Sign In / Providers → Email)');return{err:'Не удалось завершить регистрацию. Попробуйте позже.'}};setSes(j,rem,login);PRIMED=1;return{uid:j.user.id}}catch(e){return{err:'Нет связи с сервером'}}};
window.sbSignIn=async(login,pw,rem)=>{try{const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:emailOf(login),password:pw})});
  const j=await r.json().catch(()=>({}));if(!r.ok){const msg=String(j.msg||j.message||j.error_description||j.error||'');if(/invalid api key/i.test(msg))return{err:'Ошибка конфигурации сервера (API-ключ). Сообщите администратору сайта.'};return{err:r.status===400||r.status===422?'Неверный логин или пароль':'Ошибка входа: '+(msg||r.status),bad:r.status===400}}setSes(j,rem,login);return{uid:j.user.id}}catch(e){return{err:'Нет связи с сервером'}}};
window.sbHasAcc=id=>C.has('acc:'+id);
window.sbDeleteUser=async id=>{try{if(!isAdminNow()||id===me())return false;const st=C.get('st:'+id);for(const t of ((st&&st.v&&st.v.tracks)||[]))window.sbRemoveAudio(t.id);
 const r1=await rest('DELETE','kv?owner=eq.'+id),r2=await rest('DELETE','kv?peer=eq.'+id),r3=await rest('POST','kv',{k:'ban:'+id,v:{t:Date.now()}},{Prefer:'return=minimal'});
 if(!r1.ok)return false;const res=await pull(false);after(res);return true}catch(e){console.warn(e);return false}};

/* ---------- аудио в Supabase Storage ---------- */
const PUB=SB+'/storage/v1/object/public/audio/';
window.sbAudioUrl=id=>PUB+encodeURIComponent(id);
window.sbUploadAudio=async(id,file)=>{const t=await tok();const r=await fetch(SB+'/storage/v1/object/audio/'+encodeURIComponent(id),{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t,'x-upsert':'true','Content-Type':file.type||'audio/mpeg','cache-control':'3600'},body:file});return r.ok};
window.sbRemoveAudio=async id=>{try{const t=await tok();await fetch(SB+'/storage/v1/object/audio/'+encodeURIComponent(id),{method:'DELETE',headers:{apikey:KEY,Authorization:'Bearer '+t}})}catch(e){}};
window.sbRpc=async(name,args={})=>{try{if(!ses)return{error:'not authenticated'};const r=await rest('POST','rpc/'+name,args);const body=await r.json().catch(()=>({}));return r.ok?body:{error:body.message||body.details||body.hint||'Запрос отклонён'}}catch(e){return{error:'Нет связи с базой'}}};
window.sbBuyArtistSlot=()=>window.sbRpc('buy_artist_slot');
window.sbBuyPerk=(kind)=>window.sbRpc(kind==='wavr_plus'?'buy_wavr_plus':'buy_artist_plus');
window.sbGrantPerk=(id,kind,days=30)=>window.sbRpc('admin_grant_perk',{target_uid:id,kind,days});

/* ---------- чтение ---------- */
async function listKeys(){const out=[];for(let o=0;;o+=1000){const r=await rest('GET','kv?select=k,ts&order=k&limit=1000&offset='+o);if(!r.ok)throw new Error('list '+r.status);const a=await r.json();out.push(...a);if(a.length<1000)break}return out}
async function fetchRows(keys){const chunks=[];for(let i=0;i<keys.length;i+=15)chunks.push(keys.slice(i,i+15));const out=[];
 for(let i=0;i<chunks.length;i+=4){const part=await Promise.all(chunks.slice(i,i+4).map(async ks=>{const q='kv?select=k,v,ts,owner,peer&k=in.'+encodeURIComponent('('+ks.map(k=>'"'+k+'"').join(',')+')');const r=await rest('GET',q);if(!r.ok)throw new Error('rows '+r.status);return r.json()}));part.forEach(a=>out.push(...a))}return out}
function apply(ch,chk,first){const set=(k,v)=>{try{oSet.call(LS,k,v)}catch(e){}};const cat=c=>[...C.entries()].filter(([k])=>k.startsWith(c+':'));
 if(ch.has('acc')||first)set('wavr_acc',JSON.stringify(cat('acc').map(([,x])=>x.v).sort((a,b)=>(a.num||1e9)-(b.num||1e9))));
 if(ch.has('st')||first)cat('st').forEach(([k,x])=>{if(!first&&!chk.has(k))return;const id=k.slice(3);if(id===me()&&!first)return;set('wavr_u_'+id,JSON.stringify(x.v))});
 if(['fr','rq','ms','rd'].some(c=>ch.has(c))||first){const u=me(),rd={};cat('rd').forEach(([k,x])=>{const p=k.split(':');if(p[1]===u)rd[p[2]]=x.v.t});
  set(SOC,JSON.stringify({friends:cat('fr').map(([,x])=>x.v),requests:cat('rq').map(([,x])=>x.v),messages:cat('ms').map(([,x])=>x.v).sort((a,b)=>a.ts-b.ts),reads:{[u]:rd}}))}
   if(ch.has('ext')||ch.has('alb')||first)set('wavr_ext',JSON.stringify({a:cat('ext').filter(([k])=>k.startsWith('ext:a:')).map(([,x])=>x.v),t:cat('ext').filter(([k])=>k.startsWith('ext:t:')).map(([,x])=>x.v),albums:cat('alb').map(([,x])=>x.v)}));
   if(ch.has('sug')||first)set('wavr_suggestions',JSON.stringify(cat('sug').map(([k,x])=>({key:k,v:x.v}))));
  if(ch.has('perks')||first)cat('perks').forEach(([k,x])=>set('wavr_perks_'+k.slice(6),JSON.stringify(x.v)));
 if(ch.has('lim')||first){const o={};cat('lim').forEach(([k,x])=>o[k.slice(4)]=x.v.n);set('wavr_lim',JSON.stringify(o))}
 if(ch.has('cpx')||first)set('wavr_custom_prefixes',JSON.stringify(cat('cpx').map(([,x])=>x.v)))}
async function pull(first){const list=await listKeys(),seen=new Set(list.map(x=>x.k));
 const need=list.filter(x=>{const c=C.get(x.k);return(!c||c.ts!==x.ts)&&!PEND.has(x.k)&&!(RD.get(x.k)>Date.now())}).map(x=>x.k);
 const rows=need.length?await fetchRows(need):[];const chk=new Set(),newMsg=[],newSoc=[];
 rows.forEach(r=>{const had=C.has(r.k);C.set(r.k,{ts:r.ts,j:canon(r.v),v:r.v,owner:r.owner,peer:r.peer});chk.add(r.k);if(!first&&!had&&r.k.startsWith('ms:')&&r.peer===me())newMsg.push(r);if(!first&&!had&&r.owner!==me()&&r.v&&r.v.to===me()&&/^(cm|lk|rx|cl):/.test(r.k))newSoc.push(r.k.slice(0,2))});
 for(const k of [...C.keys()])if(!seen.has(k)&&!PEND.has(k)&&!((C.get(k).lt||0)>Date.now()-8000)){C.delete(k);chk.add(k)}
 const ch=new Set([...chk].map(k=>k.split(':')[0]));apply(ch,chk,first);return{chk,ch,newMsg,newSoc}}

/* ---------- запись ---------- */
async function putRow(k,o,c){PEND.add(k);try{const h={Prefer:'return=representation'};let r;
 if(c)r=await rest('PATCH','kv?k=eq.'+encodeURIComponent(k),{v:o.v},h);
 else{r=await rest('POST','kv',{k,v:o.v,peer:o.peer||null,owner:me()},h);if(r.status===409)r=await rest('PATCH','kv?k=eq.'+encodeURIComponent(k),{v:o.v},h)}
 if(!r.ok){console.warn('sb write failed',k,r.status);return}
 const a=await r.json(),row=a&&a[0];if(row){const was=canon(o.v);C.set(k,{ts:row.ts,j:canon(row.v),v:row.v,peer:row.peer,owner:row.owner});if(canon(row.v)!==was)TOUCH.add(k.split(':')[0])}
 }catch(e){console.warn(e)}finally{PEND.delete(k)}}
async function delRow(k){PEND.add(k);try{const r=await rest('DELETE','kv?k=eq.'+encodeURIComponent(k));if(r.ok)C.delete(k)}catch(e){console.warn(e)}finally{PEND.delete(k)}}
async function syncRows(want,delPre){const ops=[];
 for(const [k,o] of want){const c=C.get(k);if(c&&c.j===canon(o.v))continue;if(!c&&!o.mine)continue;ops.push(putRow(k,o,c))}
 for(const k of [...C.keys()])if(delPre.some(p=>k.startsWith(p))&&!want.has(k))ops.push(delRow(k));
 await Promise.all(ops);if(TOUCH.size){const t=new Set(TOUCH);TOUCH.clear();apply(t,new Set(),false)}}
const accRows=v=>{const m=new Map();for(const a of jp(v,[])){if(!a||!a.id)continue;if(a.id!==me()&&!isAdminNow())continue;const o={...a};delete o.salt;delete o.hash;m.set('acc:'+a.id,{v:o,mine:a.id===me()})}return m};
const socRows=v=>{const d=jp(v,{}),m=new Map(),u=me();
 for(const f of d.friends||[])m.set('fr:'+[f.a,f.b].sort().join('::'),{v:f,peer:f.a===u?f.b:f.a,mine:f.a===u});
 for(const r of d.requests||[])m.set('rq:'+r.id,{v:r,peer:r.to,mine:r.from===u});
 for(const x of d.messages||[])m.set('ms:'+x.id,{v:x,peer:x.to,mine:x.from===u});
 const rd=(d.reads||{})[u]||{};for(const p in rd)m.set('rd:'+u+':'+p,{v:{t:rd[p]},mine:true});return m};
const extRows=v=>{const d=jp(v,{a:[],t:[],albums:[]}),m=new Map();for(const a of d.a||[])m.set('ext:a:'+a.id,{v:a,mine:true});for(const t of d.t||[])m.set('ext:t:'+t.id,{v:t,mine:true});for(const a of d.albums||[])if(a&&a.ar&&a.id)m.set('alb:'+a.ar+':'+a.id,{v:a,mine:true});return m};
function run(k){const e=Q.get(k);if(!e)return;clearTimeout(e.t);Q.delete(k);const p=Promise.resolve().then(e.fn).catch(x=>console.warn(x)).finally(()=>FLY.delete(p));FLY.add(p)}
const schedule=(k,ms,fn)=>{const o=Q.get(k);if(o)clearTimeout(o.t);Q.set(k,{fn,t:setTimeout(()=>run(k),ms)})};
window.sbFlush=async()=>{for(const k of [...Q.keys()])run(k);await Promise.allSettled([...FLY])};
addEventListener('pagehide',()=>{for(const k of [...Q.keys()])run(k)});
function onLS(k,v){
 if(k==='wavr_acc')schedule('acc',300,()=>syncRows(accRows(v),[]));
 else if(k.startsWith('wavr_u_')){const id=k.slice(7);if(id===me()||isAdminNow())schedule('st:'+id,id===me()?600:300,()=>syncRows(new Map([['st:'+id,{v:jp(v,{}),mine:true}]]),[]))}
 else if(k===SOC)schedule('soc',250,()=>syncRows(socRows(v),['fr:','rq:']));
  else if(k==='wavr_ext')schedule('ext',500,()=>syncRows(extRows(v),['ext:','alb:']));
 else if(k==='wavr_lim')schedule('lim',300,()=>{const o=jp(v,{}),m=new Map();for(const id in o)m.set('lim:'+id,{v:{n:o[id]},mine:true});return syncRows(m,[])});
 else if(k==='wavr_custom_prefixes')schedule('cpx',300,()=>{const m=new Map();for(const p of jp(v,[]))if(p&&p.id)m.set('cpx:'+p.id,{v:p,mine:true});return syncRows(m,[])})}
SP.setItem=function(k,v){const r=oSet.apply(this,arguments);if(this===LS&&ses&&PRIMED)try{onLS(k,String(v))}catch(e){console.error(e)}return r};

/* ---------- общий соц-слой: комментарии, реакции, лайки, закрепы, прослушивания ---------- */
const SOCP=/^(cm|lk|rx|cl|pin|pc):/;
{const os=C.set.bind(C),od=C.delete.bind(C);C.ver=0;C.set=(k,v)=>{C.ver++;return os(k,v)};C.delete=k=>{C.ver++;return od(k)}}
let IDX=null,IV=-1,PT=0;const RD=new Map();
const ping=()=>{clearTimeout(PT);PT=setTimeout(()=>{try{if(APP&&!typing())softRender()}catch(e){}},120)};
window.sbReady=()=>!!(ses&&PRIMED);
window.sbIdx=()=>{if(IDX&&IV===C.ver)return IDX;
 const I={cm:{},lk:{},rx:{},cl:{},pin:{},pc:{},mine:new Set()},u=me();
 for(const [k,x] of C){const i=k.indexOf(':');if(i<0)continue;const v=x.v;if(!v||!SOCP.test(k))continue;const p=k.slice(0,i),pr=k.split(':');
  if(p==='cm')(I.cm[v.tid]=I.cm[v.tid]||[]).push({...v,id:v.id||pr[2]});
  else if(p==='lk'){(I.lk[v.tid]=I.lk[v.tid]||[]).push(v.u);if(v.u===u)I.mine.add(v.tid)}
  else if(p==='rx')(I.rx[v.tid]=I.rx[v.tid]||[]).push({...v,id:v.id||pr[3]});
  else if(p==='cl')(I.cl[v.cid]=I.cl[v.cid]||[]).push(v.u);
  else if(p==='pin')(I.pin[v.tid]=I.pin[v.tid]||{})[pr[1]]=v.cid;
  else if(p==='pc'){const o=I.pc[v.tid]=I.pc[v.tid]||{n:0,d:{}};o.n+=v.n||0;for(const d in (v.d||{}))o.d[d]=(o.d[d]||0)+v.d[d]}}
 for(const t in I.cm)I.cm[t].sort((a,b)=>(a.t-b.t)||(a.ts-b.ts));for(const t in I.rx)I.rx[t].sort((a,b)=>(a.t-b.t)||(a.ts-b.ts));
 IDX=I;IV=C.ver;return I};
window.sbPut=async(k,v,peer)=>{if(!ses||!PRIMED)return false;const old=C.get(k);C.set(k,{ts:(old&&old.ts)||null,j:canon(v),v,owner:me(),peer:peer||null,lt:Date.now()});PEND.add(k);
 try{const h={Prefer:'return=representation'};let r;
  if(old&&old.ts)r=await rest('PATCH','kv?k=eq.'+encodeURIComponent(k),{v},h);
  else{r=await rest('POST','kv',{k,v,peer:peer||null,owner:me()},h);if(r.status===409)r=await rest('PATCH','kv?k=eq.'+encodeURIComponent(k),{v},h)}
  if(!r.ok){console.warn('sb put failed',k,r.status);if(old)C.set(k,old);else C.delete(k);return false}
  const a=await r.json(),row=a&&a[0];if(!row){if(old)C.set(k,old);else C.delete(k);return false}
  C.set(k,{ts:row.ts,j:canon(row.v),v:row.v,owner:row.owner,peer:row.peer,lt:Date.now()});return true}
 catch(e){console.warn(e);if(old)C.set(k,old);else C.delete(k);return false}
  finally{PEND.delete(k);ping()}};
 window.sbSuggestions=()=>[...C.entries()].filter(([k])=>k.startsWith('sug:')).map(([key,x])=>({key,v:x.v}));
 window.sbResolveSuggestion=async(id,status,trackId)=>{
  if(!isAdminNow()||!['accepted','rejected'].includes(status))return false;
  const key='sug:'+id,x=C.get(key);if(!x||!x.v)return false;
  return window.sbPut(key,{...x.v,status,...(trackId?{track_id:trackId}:{})});
 };
window.sbDel=async k=>{if(!ses||!PRIMED)return false;const old=C.get(k);C.delete(k);PEND.add(k);
 try{const r=await rest('DELETE','kv?k=eq.'+encodeURIComponent(k),null,{Prefer:'return=representation'});let ok=r.ok;if(ok){const a=await r.json().catch(()=>[]);ok=Array.isArray(a)&&a.length>0}
  if(!ok&&old)C.set(k,old);if(ok)RD.set(k,Date.now()+8000);return ok}
 catch(e){if(old)C.set(k,old);return false}
 finally{PEND.delete(k);ping()}};
/* ---------- «слушает сейчас»: отдельная лёгкая строка np:<uid>, пишется без перерисовки страницы ---------- */
window.sbNp=id=>{const x=C.get('np:'+id);return x&&x.v&&typeof x.v==='object'?x.v:null};
window.sbNpPut=async v=>{if(!ses||!PRIMED)return false;const k='np:'+me(),old=C.get(k),enc=encodeURIComponent(k),h={Prefer:'return=representation'};PEND.add(k);
 try{let row=null;for(const m of(old&&old.ts?['PATCH','POST']:['POST','PATCH'])){
   const r=m==='PATCH'?await rest('PATCH','kv?k=eq.'+enc,{v},h):await rest('POST','kv',{k,v,peer:null,owner:me()},h);
   if(r.ok){const a=await r.json().catch(()=>[]);row=a&&a[0];if(row)break}
   else if(m==='POST'&&r.status!==409){console.warn('sb np failed',r.status);return false}}
  if(!row)return false;C.set(k,{ts:row.ts,j:canon(row.v),v:row.v,owner:row.owner,peer:row.peer,lt:Date.now()});return true}
 catch(e){console.warn(e);return false}finally{PEND.delete(k)}};
window.sbNpDel=async()=>{if(!ses||!PRIMED)return false;const k='np:'+me();PEND.add(k);
 try{const r=await rest('DELETE','kv?k=eq.'+encodeURIComponent(k));if(r.ok){C.delete(k);RD.set(k,Date.now()+8000);return true}return false}
 catch(e){return false}finally{PEND.delete(k)}};
window.sbPurge=pred=>{const ks=[];for(const [k,x] of C)if(SOCP.test(k)&&x.v&&pred(x.v,k))ks.push(k);return Promise.all(ks.map(k=>window.sbDel(k)))};
window.sbLike=(tid,on,to)=>{const k='lk:'+tid+':'+me();return on?window.sbPut(k,{tid,u:me(),to:to||'',ts:Date.now()}):window.sbDel(k)};
window.sbPlay=(tid,to)=>{if(!ses||!PRIMED)return;const k='pc:'+tid+':'+me(),c=C.get(k),v=c&&c.v?{...c.v,d:{...(c.v.d||{})}}:{tid,u:me(),to:to||'',n:0,d:{}},dk=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
 v.n=(v.n||0)+1;v.d[dk]=(v.d[dk]||0)+1;const keep=Object.keys(v.d).sort().slice(-45),nd={};keep.forEach(x=>nd[x]=v.d[x]);v.d=nd;window.sbPut(k,v)};

/* ---------- обновление интерфейса после опроса ---------- */
function softRender(){const a=document.activeElement,m=document.getElementById('main');let st=null;
 if(a&&m&&m.contains(a)&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')&&a.value)st={id:a.id,name:a.name,val:a.value};
 render(true);if(st){const e=(st.id&&document.getElementById(st.id))||(st.name&&m.querySelector('[name="'+st.name+'"]'));if(e){e.value=st.val;e.focus()}}}
const typing=()=>{const a=document.activeElement,m=document.getElementById('main');return a&&m&&m.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.value&&route().p!=='friends'};
function after(res){const{ch,chk,newMsg,newSoc=[]}=res;if(!ch.size||!APP)return;
 try{
  if(me()&&(C.has('ban:'+me())||(!C.has('acc:'+me())&&PRIMED&&POLLED))){LS.removeItem('wavr_sess');location.reload();return}
  if(ch.has('ext')||ch.has('alb')){const d=jp(LS.getItem('wavr_ext'),{a:[],t:[],albums:[]});EXT.a.length=0;EXT.t.length=0;EXT.albums.length=0;EXT.a.push(...(d.a||[]));EXT.t.push(...(d.t||[]));EXT.albums.push(...(d.albums||[]));extReg()}
  if(ch.has('np')){try{npDom()}catch(e){}}
   if(ch.has('st')||ch.has('acc'))regUsers();

function startPoll(){const go=()=>{if(document.hidden||!ses||POLLING)return;POLLING=1;pull(false).then(r=>{POLLED=1;after(r)}).catch(e=>console.warn('poll',e)).finally(()=>{POLLING=0})};setInterval(go,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)go()})}
async function migrateAudio(){for(const t of S.tracks.slice()){if(t.up)continue;const b=await idbGet('a_'+t.id);if(!b)continue;try{if(await window.sbUploadAudio(t.id,b)){t.up=1;save()}}catch(e){}}}

 const s=document.createElement('script');s.textContent=document.getElementById('app-src').textContent;document.body.appendChild(s);APP=1;

 else if(offline)setTimeout(()=>toast('Нет связи с базой — изменения сейчас не сохраняются на сервер'),1500)}
